name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, format, test
        run: npm run check

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_CONTACT_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_CONTACT_ACCESS_KEY }}
          VITE_WEB3FORMS_NEWSLETTER_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_NEWSLETTER_ACCESS_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
