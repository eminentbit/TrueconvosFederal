name: Deploy to GitHub Pages

# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Run deployments one at a time, and never cancel one partway through.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Typecheck, lint, format, test
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # "/TrueconvosFederal" on github.io; "" once a custom domain is set.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_WEB3FORMS_CONTACT_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_CONTACT_ACCESS_KEY }}
          VITE_WEB3FORMS_NEWSLETTER_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_NEWSLETTER_ACCESS_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
